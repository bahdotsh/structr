[package]
name = "structr"
version = "0.3.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Generate Rust structs from JSON data with framework integrations"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
convert_case = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
atty = "0.2"
